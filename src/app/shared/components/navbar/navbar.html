<nav class="fixed top-0 left-0 w-full z-50 bg-brand-ivory/80 backdrop-blur-md border-b border-brand-blush transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" class="flex items-center">
          <img src="logo.png" alt="Dina's Allure" class="h-8 sm:h-9 w-auto object-contain" />
        </a>
      </div>

      <!-- Desktop Links -->
      <div class="hidden md:flex space-x-10">
        <a routerLink="/" class="font-sans text-brand-ink hover:text-brand-pink transition-colors text-sm font-medium tracking-wide uppercase">Home</a>
        <a routerLink="/" fragment="shop" class="font-sans text-brand-ink hover:text-brand-pink transition-colors text-sm font-medium tracking-wide uppercase">Shop</a>
        <a routerLink="/" fragment="story" class="font-sans text-brand-ink hover:text-brand-pink transition-colors text-sm font-medium tracking-wide uppercase">Our Story</a>
        <a routerLink="/" fragment="ingredients" class="font-sans text-brand-ink hover:text-brand-pink transition-colors text-sm font-medium tracking-wide uppercase">Ingredients</a>
        <a routerLink="/contact" routerLinkActive="!text-brand-pink" class="font-sans text-brand-ink hover:text-brand-pink transition-colors text-sm font-medium tracking-wide uppercase">Contact</a>
      </div>

      <!-- Mobile menu button -->
      <div class="flex md:hidden items-center">
        <button (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle menu" class="text-brand-ink hover:text-brand-pink focus:outline-none p-2 rounded-md transition-colors">
          <svg *ngIf="!isMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-brand-ivory border-b border-brand-blush shadow-lg absolute w-full">
    <div class="px-4 pt-4 pb-6 space-y-4 shadow-inner">
      <a routerLink="/" (click)="isMenuOpen = false" class="block px-3 py-2 text-brand-ink hover:text-brand-pink font-sans font-medium tracking-wide uppercase text-sm">Home</a>
      <a routerLink="/" fragment="shop" (click)="isMenuOpen = false" class="block px-3 py-2 text-brand-ink hover:text-brand-pink font-sans font-medium tracking-wide uppercase text-sm">Shop</a>
      <a routerLink="/" fragment="story" (click)="isMenuOpen = false" class="block px-3 py-2 text-brand-ink hover:text-brand-pink font-sans font-medium tracking-wide uppercase text-sm">Our Story</a>
      <a routerLink="/" fragment="ingredients" (click)="isMenuOpen = false" class="block px-3 py-2 text-brand-ink hover:text-brand-pink font-sans font-medium tracking-wide uppercase text-sm">Ingredients</a>
      <a routerLink="/contact" routerLinkActive="!text-brand-pink" (click)="isMenuOpen = false" class="block px-3 py-2 text-brand-ink hover:text-brand-pink font-sans font-medium tracking-wide uppercase text-sm">Contact</a>
    </div>
  </div>
</nav>
